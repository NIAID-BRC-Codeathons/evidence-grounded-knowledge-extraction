<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LitRAG — Literature Curation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a6fb5'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Helvetica,Arial' font-weight='bold' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>LitRAG</h1>
  <span class="tagline">Automated literature curation &amp; knowledge extraction</span>
  <span class="spacer"></span>
  <span id="serverInfo" class="serverInfo"></span>
</header>

<section class="searchPanel">
  <form id="searchForm" autocomplete="off">
    <div class="formRow">
      <div class="formGroup grow">
        <label for="organism" title="The pathogen to search for. Free text, matched semantically - 'M. tuberculosis' and 'Mycobacterium tuberculosis' both work.">Organism of Interest <span class="req">*</span></label>
        <input type="text" id="organism" required
               placeholder="e.g., SARS-CoV-2, Mycobacterium tuberculosis">
      </div>
      <div class="formGroup grow">
        <label for="genes" title="Genes or proteins of interest, comma separated. Naming a specific gene makes this a known-item search, where Full depth works best.">Genes of Interest</label>
        <input type="text" id="genes" placeholder="e.g., Spike, NSP13, ACE2 (comma-separated)">
      </div>
    </div>

    <div class="formRow">
      <div class="formGroup grow">
        <label for="otherTerms" title="Extra search terms - a phenotype, a drug, a condition. Added to the search query, and narrows which passages come back.">Other Terms <span class="hint" aria-hidden="true">?</span></label>
        <input type="text" id="otherTerms"
               placeholder="e.g., antibiotic resistance, viral entry, host interaction">
      </div>
    </div>

    <div class="formRow controls">
      <div class="formGroup">
        <label for="dataType" title="The table to extract. Each data type is a server-defined template that fixes the columns and the extraction rules.">Data Type <span class="hint" aria-hidden="true">?</span></label>
        <select id="dataType"></select>
      </div>
      <div class="formGroup">
        <label for="collection" title="Which corpus to search. PubMed Central is the broadest (47.6M passages). The small curated sets - Dengue, Influenza - are only a handful of papers each, so a fact not in those papers cannot be found there at any depth.">Collection <span class="hint" aria-hidden="true">?</span></label>
        <select id="collection"></select>
      </div>
      <div class="formGroup">
        <label for="backend" title="Which model writes the table. Qwen and Llama run on Argonne's local GPUs. Hosted RAGStack uses its own server-side prompt, so it cannot be used with Adaptive or Full depth.">Model <span class="hint" aria-hidden="true">?</span></label>
        <select id="backend"></select>
      </div>
      <div class="formGroup">
        <label for="depth" title="How much of each paper to read before extracting. Search returns fragments, not whole papers: the fragment that matched your words is often the Introduction, while the finding is in the Results. This chooses how far past the fragment to read.">Reading depth <span class="hint" aria-hidden="true">?</span></label>
        <select id="depth" title="Standard: only the passages search returned. Adaptive: also the passages either side of each hit. Full: the best-ranked papers read end to end.">
          <option value="standard" selected
                  title="The original behaviour. Only the passages search returned - about 10 fragments from 8 different papers. Fastest (~5s), and the baseline to compare against.">Standard &mdash; top results only</option>
          <option value="adaptive"
                  title="Reads the passages either side of every hit, so the model sees surrounding context rather than an isolated fragment. How far is set by the size of the collection. ~200 passages from ~70 papers, ~20s. Best for open-ended questions.">Adaptive &mdash; read around each hit</option>
          <option value="full"
                  title="Reads the best-ranked papers from start to finish, rather than widening a window around every paper. Slower (~40s) but the only mode that can find a fact buried in the middle of a paper. Best when you have named a specific gene.">Full &mdash; read the top papers end to end</option>
        </select>
      </div>
      <div class="formGroup topk">
        <label for="topK" title="How many passages the search returns before any reading-depth expansion. This is the breadth lever: more distinct papers. The API caps it at 100.">RAG Results <span id="topKValue" class="topKValue">10</span></label>
        <input type="range" id="topK" min="1" max="100" value="10">
      </div>
      <div class="formGroup check">
        <label class="checkLabel">
          <input type="checkbox" id="dedupe" checked
                 title="Collapse rows describing the same fact, including different notations for one mutation (S315T and Ser315Thr). Merged rows accumulate a Support count and keep every citation."> Merge duplicates
        </label>
        <label class="checkLabel">
          <input type="checkbox" id="keepEmpty"
                 title="Keep rows that restate the query without reporting a finding. Normally dropped; useful when you want to see everything the model produced."> Keep empty rows
        </label>
      </div>
      <div class="formGroup buttons">
        <button type="submit" id="searchBtn" class="primary">Search &amp; Extract</button>
        <button type="button" id="viewRequestBtn" class="secondary" disabled>View request</button>
      </div>
    </div>
  </form>
</section>

<main class="results">
  <div id="status" class="status">Enter an organism to search the literature.</div>
  <div id="summary" class="summary hidden"></div>

  <section id="answerSection" class="answerSection hidden">
    <div class="sectionHeader">
      <h2 id="answerTitle">Extracted Data</h2>
      <div class="downloads">
        <span class="dlLabel">Download</span>
        <button data-fmt="tsv" class="dl">TSV</button>
        <button data-fmt="csv" class="dl">CSV</button>
        <button data-fmt="json" class="dl">JSON</button>
        <button data-fmt="md" class="dl">MD</button>
      </div>
    </div>
    <div id="answerBody"></div>
  </section>

  <section id="sourcesSection" class="sourcesSection hidden">
    <h2 id="sourcesTitle">Sources</h2>
    <div id="sourcesBody"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modalCard">
    <div class="modalHeader">
      <h3 id="modalTitle">Request</h3>
      <button type="button" id="modalClose" class="modalClose">&times;</button>
    </div>
    <div class="modalNote" id="modalNote"></div>
    <pre id="modalBody" class="modalBody"></pre>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
