[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litrag"
version = "0.1.0"
description = "Automated literature curation and knowledge extraction over the BV-BRC RAGStack API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.24",
    "typer>=0.9",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pyyaml>=6.0",
]

# Kept for `pip install -e ".[dev]"`; uv uses the dependency-group below.
[project.optional-dependencies]
dev = ["pytest>=7.4"]

# PEP 735 group -- installed automatically by `uv sync` / `uv run`.
[dependency-groups]
dev = ["pytest>=7.4"]

[project.scripts]
litrag = "litrag.cli:main"

[tool.setuptools.packages.find]
include = ["litrag*"]

[tool.setuptools.package-data]
litrag = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
